[project]
name = "evcs-atlas"
version = "0.1.0"
description = "Tập bản đồ + bộ dữ liệu nền cho bài toán đặt trạm sạc EV — 34 tỉnh, một khái niệm một trường"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2",
    "shapely>=2.0",
    "h3>=4.1",
    "rasterio>=1.4",
    "scipy>=1.14",
    "osmium>=4.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "websockets>=17.0.1",
    "pytest>=8.4",
    "ruff>=0.16.2",
]
notebook = [
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.0",
    "scikit-learn>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evcs", "src/vn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
